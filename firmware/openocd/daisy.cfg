# OpenOCD board config for the Electrosmith Daisy Seed (STM32H750IB) via ST-Link.
#
# Used as the "Board config file" in CLion's OpenOCD Download & Run/Debug config,
# and directly from the command line:
#   openocd -f firmware/openocd/daisy.cfg -c "program build/absonus.elf verify reset exit"
#
# It just combines the two stock OpenOCD scripts the ST-Link flow needs.

source [find interface/stlink.cfg]

# ST-Link V3 note: if OpenOCD fails to connect to the target, uncomment this line
# to force the newer SWD transport.
# transport select dapdirect_swd

source [find target/stm32h7x.cfg]